<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>多資產即時進場助手</title>
<style>
:root{
  --bg:#0d1420;--panel:#142033;--panel2:#1a2940;--line:#2c3d57;
  --text:#eef5ff;--muted:#8fa5bf;--green:#31df77;--red:#ff4d67;
  --yellow:#ffc400;--cyan:#19c7e6;--blue:#2d89ef;--purple:#b05cff;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0c1320,#0a111b);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1680px;margin:auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:24px}.sub{font-size:12px;color:var(--muted);margin-top:5px}
.conn{font-size:12px;padding:8px 12px;border-radius:999px;border:1px solid #245c3b;background:#0f2519;color:var(--green);font-weight:800}
.filters{display:grid;grid-template-columns:1.15fr .8fr .7fr .7fr 1fr auto;gap:10px;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:14px;margin-bottom:14px}
.field{position:relative}
.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
input,select,button{width:100%;background:#0f1928;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--cyan)}
button{cursor:pointer;font-weight:800}
button.primary{background:#0e6380;border-color:#1685a8}
button.ghost{background:#18253a}
.suggestions{position:absolute;top:62px;left:0;right:0;background:#0f1928;border:1px solid var(--line);border-radius:10px;z-index:20;max-height:220px;overflow:auto;display:none}
.suggestions div{padding:9px 10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.suggestions div:hover{background:#1a2940}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;gap:12px;align-items:center}
.icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:900;background:#12233a;border:1px solid #23476f}
.stat small{display:block;color:var(--muted);margin-bottom:4px}.stat strong{font-size:24px}
.good{color:var(--green)}.bad{color:var(--red)}.wait{color:var(--yellow)}.cyan{color:var(--cyan)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center}
.toolbar select{width:92px}.toolbar input{width:260px}
.table-wrap{overflow:auto}
table{width:100%;min-width:1580px;border-collapse:collapse;white-space:nowrap}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;text-align:center}
th{background:#101a29;color:var(--cyan);font-weight:800;position:sticky;top:0;z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:3}
td:first-child{background:#142033;font-weight:800}
tr:hover td{filter:brightness(1.1)}
.buy{color:var(--green);font-weight:900}.sell{color:var(--red);font-weight:900}
.badge{display:inline-block;padding:5px 9px;border-radius:7px;font-weight:900;font-size:12px}
.b-open{background:rgba(255,196,0,.16);color:var(--yellow);border:1px solid rgba(255,196,0,.45)}
.b-win{background:rgba(49,223,119,.16);color:var(--green);border:1px solid rgba(49,223,119,.45)}
.b-loss{background:rgba(255,77,103,.16);color:var(--red);border:1px solid rgba(255,77,103,.45)}
.b-be{background:rgba(25,199,230,.16);color:var(--cyan);border:1px solid rgba(25,199,230,.45)}
.tp-hit{background:rgba(49,223,119,.10);color:var(--green);font-weight:900}
.tp-wait{color:#d7e3f2}
.footer{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:var(--muted);font-size:12px}
.pages{display:flex;gap:6px}.pages button{width:auto;min-width:36px;padding:7px 10px}
.pages button.active{background:#255f94;border-color:#2e7ac0}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.toolbar{align-items:flex-start;flex-direction:column}}

/* v4.1：交易狀態整格/整列底色 */
tr.row-open td{background:rgba(255,196,0,.055)}
tr.row-win td{background:rgba(49,223,119,.075)}
tr.row-loss td{background:rgba(255,77,103,.085)}
tr.row-be td{background:rgba(25,199,230,.07)}

tr.row-open td:first-child{background:#1b1a12}
tr.row-win td:first-child{background:#101d17}
tr.row-loss td:first-child{background:#211317}
tr.row-be td:first-child{background:#101d20}

td.dir-buy{background:rgba(49,223,119,.12)!important;color:var(--green);font-weight:900}
td.dir-sell{background:rgba(255,77,103,.12)!important;color:var(--red);font-weight:900}

td.result-cell-open{background:rgba(255,196,0,.28)!important}
td.result-cell-win{background:rgba(49,223,119,.28)!important}
td.result-cell-loss{background:rgba(255,77,103,.30)!important}
td.result-cell-be{background:rgba(25,199,230,.28)!important}

td.tp-hit{background:rgba(49,223,119,.22)!important;color:var(--green);font-weight:900}
td.tp-wait{background:rgba(255,255,255,.02);color:#d7e3f2}

</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>多資產即時進場助手</h1>
      <div class="sub">交易後台｜正式單歷史紀錄與即時狀態</div>
    </div>
    <div class="conn" id="conn">● 已連線</div>
  </div>

  <div class="filters">
    <div class="field">
      <label>商品搜尋</label>
      <input id="symbolSearch" autocomplete="off" placeholder="輸入 XAU、BTC、ETH..." oninput="showSymbolSuggestions()" />
      <div class="suggestions" id="symbolSuggestions"></div>
    </div>
    <div class="field">
      <label>時間週期</label>
      <input id="tfSearch" autocomplete="off" placeholder="輸入 5M、15M、1H..." oninput="showTfSuggestions()" />
      <div class="suggestions" id="tfSuggestions"></div>
    </div>
    <div class="field">
      <label>模式</label>
      <select id="modeFilter">
        <option value="">全部模式</option>
        <option value="1">① 回踩</option><option value="2">② 續攻</option><option value="3">③ 突破</option>
        <option value="4">④ 強趨勢</option><option value="5">⑤ 急拉回落</option><option value="6">⑥ SMC</option>
      </select>
    </div>
    <div class="field">
      <label>結果</label>
      <select id="resultFilter">
        <option value="">全部結果</option>
        <option value="OPEN">進行中</option><option value="WIN">獲利</option><option value="LOSS">虧損</option><option value="BE">保本</option>
      </select>
    </div>
    <div class="field">
      <label>關鍵字搜尋</label>
      <input id="keyword" placeholder="單號 / 多空 / 模式..." />
    </div>
    <div class="field" style="display:flex;align-items:flex-end;gap:8px">
      <button class="primary" onclick="applyFilters()">查詢</button>
      <button class="ghost" onclick="resetFilters()">清除</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="icon">📊</div><div><small>總交易</small><strong id="sTotal">0</strong></div></div>
    <div class="stat"><div class="icon">✅</div><div><small>獲利</small><strong class="good" id="sWin">0</strong></div></div>
    <div class="stat"><div class="icon">❌</div><div><small>虧損</small><strong class="bad" id="sLoss">0</strong></div></div>
    <div class="stat"><div class="icon">⏳</div><div><small>進行中</small><strong class="wait" id="sOpen">0</strong></div></div>
    <div class="stat"><div class="icon">%</div><div><small>勝率</small><strong class="cyan" id="sRate">0.0%</strong></div></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <span>顯示</span>
        <select id="pageSize" onchange="changePageSize()">
          <option>10</option><option>25</option><option>50</option><option>100</option>
        </select>
        <span>筆</span>
      </div>
      <div class="toolbar-right">
        <span id="activeScope">請先選擇商品與週期</span>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>單號</th><th>訊號時間</th><th>商品</th><th>週期</th><th>方向</th><th>模式</th>
            <th>Entry</th><th>SL</th><th>TP1</th><th>TP2</th><th>TP3</th><th>品質</th>
            <th>結果</th><th>出場價</th><th>最後更新</th><th>來源</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="16" class="empty">請先搜尋並選擇「商品」與「時間週期」</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer">
      <div id="countText">0 筆</div>
      <div class="pages" id="pages"></div>
    </div>
  </div>
</div>

<script>
const SYMBOLS=['XAUUSD','XAGUSD','BTCUSDT','ETHUSDT','SOLUSDT','DOGEUSDT','PEPEUSDT','NASDAQ','SPX500','US30','RUS空單2000'];
const TFS=['1','3','5','10','15','30','60','240'];
const TF_LABEL={'1':'1M','3':'3M','5':'5M','10':'10M','15':'15M','30':'30M','60':'1H','240':'4H'};
let allTrades=[], filtered=[], page=1;

const $=s=>document.querySelector(s);
function modeText(v){const m={1:'① 回踩',2:'② 續攻',3:'③ 突破',4:'④ 強趨勢',5:'⑤ 急拉回落',6:'⑥ SMC'};return m[v]||v||'-'}
function n(v){return v===null||v===undefined||v===''?'-':Number(v).toFixed(2)}
function ft(v){return v?new Date(v).toLocaleString('zh-TW',{hour12:false}):'-'}
function resultBadge(v){
 if(v==='WIN')return '<span class="badge b-win">獲利</span>';
 if(v==='LOSS')return '<span class="badge b-loss">虧損</span>';
 if(v==='BE')return '<span class="badge b-be">保本</span>';
 return '<span class="badge b-open">進行中</span>';
}
function rowClass(v){
 if(v==='WIN')return 'row-win';
 if(v==='LOSS')return 'row-loss';
 if(v==='BE')return 'row-be';
 return 'row-open';
}
function resultCellClass(v){
 if(v==='WIN')return 'result-cell-win';
 if(v==='LOSS')return 'result-cell-loss';
 if(v==='BE')return 'result-cell-be';
 return 'result-cell-open';
}
function chooseSymbol(v){$('#symbolSearch').value=v;$('#symbolSuggestions').style.display='none'}
function chooseTf(v){$('#tfSearch').value=TF_LABEL[v]||v;$('#tfSearch').dataset.value=v;$('#tfSuggestions').style.display='none'}
function showSymbolSuggestions(){
 const q=$('#symbolSearch').value.trim().toUpperCase();
 const box=$('#symbolSuggestions');
 const hits=SYMBOLS.filter(x=>x.includes(q)).slice(0,12);
 box.innerHTML=hits.map(x=>`<div onclick="chooseSymbol('${x}')">${x}</div>`).join('');
 box.style.display=hits.length?'block':'none';
}
function showTfSuggestions(){
 const q=$('#tfSearch').value.trim().toUpperCase();
 const box=$('#tfSuggestions');
 const hits=TFS.filter(v=>(TF_LABEL[v]||v).includes(q));
 box.innerHTML=hits.map(v=>`<div onclick="chooseTf('${v}')">${TF_LABEL[v]}</div>`).join('');
 box.style.display=hits.length?'block':'none';
}
function parseTf(){
 const raw=$('#tfSearch').value.trim().toUpperCase();
 const map={'1M':'1','3M':'3','5M':'5','10M':'10','15M':'15','30M':'30','1H':'60','4H':'240'};
 return $('#tfSearch').dataset.value || map[raw] || (TFS.includes(raw)?raw:'');
}
async function applyFilters(){
 const symbol=$('#symbolSearch').value.trim().toUpperCase();
 const tf=parseTf();
 if(!symbol || !tf){
   alert('請先選擇商品與時間週期');
   return;
 }
 $('#activeScope').textContent=`${symbol}｜${TF_LABEL[tf]||tf}`;
 $('#conn').textContent='● 讀取中';
 try{
   const r=await fetch('/api/trades?symbol='+encodeURIComponent(symbol),{cache:'no-store'});
   const j=await r.json();
   if(!r.ok)throw new Error(j.error||'讀取失敗');
   allTrades=j.trades||[];
   runClientFilter();
   $('#conn').textContent='● 已連線';
 }catch(e){
   $('#conn').textContent='● 讀取失敗';
   alert(e.message);
 }
}
function runClientFilter(){
 const tf=parseTf();
 const mode=$('#modeFilter').value;
 const result=$('#resultFilter').value;
 const kw=$('#keyword').value.trim().toLowerCase();

 filtered=allTrades.filter(t=>{
   if(String(t.timeframe)!==String(tf))return false;
   if(mode && String(t.mode)!==mode)return false;
   if(result && String(t.result)!==result)return false;
   if(kw){
     const hay=[t.external_trade_id,t.id,t.symbol,t.direction,modeText(t.mode),t.result].join(' ').toLowerCase();
     if(!hay.includes(kw))return false;
   }
   return true;
 });
 page=1;
 renderStats();
 renderTable();
}
function renderStats(){
 const total=filtered.length, win=filtered.filter(x=>x.result==='WIN').length, loss=filtered.filter(x=>x.result==='LOSS').length, open=filtered.filter(x=>x.result==='OPEN').length;
 const settled=win+loss;
 $('#sTotal').textContent=total;$('#sWin').textContent=win;$('#sLoss').textContent=loss;$('#sOpen').textContent=open;$('#sRate').textContent=(settled?win*100/settled:0).toFixed(1)+'%';
}
function renderTable(){
 const ps=Number($('#pageSize').value), totalPages=Math.max(1,Math.ceil(filtered.length/ps));
 if(page>totalPages)page=totalPages;
 const start=(page-1)*ps, rows=filtered.slice(start,start+ps);
 const body=$('#rows'); body.innerHTML='';
 if(!rows.length){
   body.innerHTML='<tr><td colspan="16" class="empty">沒有符合條件的交易</td></tr>';
 }else{
   for(const t of rows){
     const dir=String(t.direction||'').toUpperCase();
     const id=t.external_trade_id??t.id;
     body.innerHTML+=`<tr class="${rowClass(t.result)}">
       <td>#${id}</td><td>${ft(t.signal_time)}</td><td>${t.symbol||'-'}</td><td>${TF_LABEL[String(t.timeframe)]||t.timeframe||'-'}</td>
       <td class="${dir==='多單'?'dir-buy':'dir-sell'}">${dir}</td><td>${modeText(t.mode)}</td>
       <td>${n(t.entry)}</td><td>${n(t.sl)}</td>
       <td class="${t.hit_tp1?'tp-hit':'tp-wait'}">${n(t.tp1)}${t.hit_tp1?' ✓':''}</td>
       <td class="${t.hit_tp2?'tp-hit':'tp-wait'}">${n(t.tp2)}${t.hit_tp2?' ✓':''}</td>
       <td class="${t.hit_tp3?'tp-hit':'tp-wait'}">${n(t.tp3)}${t.hit_tp3?' ✓':''}</td>
       <td>${t.quality==null?'-':Number(t.quality).toFixed(0)+'%'}</td>
       <td class="${resultCellClass(t.result)}">${resultBadge(t.result)}</td>
       <td>${n(t.exit_price)}</td><td>${ft(t.status_updated_at||t.created_at)}</td><td>${t.source||'-'}</td>
     </tr>`;
   }
 }
 $('#countText').textContent=`${filtered.length} 筆｜第 ${page}/${totalPages} 頁`;
 renderPages(totalPages);
}
function renderPages(totalPages){
 const box=$('#pages');box.innerHTML='';
 for(let p=1;p<=totalPages;p++){
   if(totalPages>9 && Math.abs(p-page)>2 && p!==1 && p!==totalPages)continue;
   const b=document.createElement('button');b.textContent=p;b.className=p===page?'active':'';
   b.onclick=()=>{page=p;renderTable()};box.appendChild(b);
 }
}
function changePageSize(){page=1;renderTable()}
function resetFilters(){
 $('#symbolSearch').value='';$('#tfSearch').value='';delete $('#tfSearch').dataset.value;
 $('#modeFilter').value='';$('#resultFilter').value='';$('#keyword').value='';
 allTrades=[];filtered=[];page=1;
 $('#activeScope').textContent='請先選擇商品與週期';
 renderStats();
 $('#rows').innerHTML='<tr><td colspan="16" class="empty">請先搜尋並選擇「商品」與「時間週期」</td></tr>';
 $('#countText').textContent='0 筆';$('#pages').innerHTML='';
}
$('#modeFilter').addEventListener('change',()=>{if(allTrades.length)runClientFilter()});
$('#resultFilter').addEventListener('change',()=>{if(allTrades.length)runClientFilter()});
$('#keyword').addEventListener('input',()=>{if(allTrades.length)runClientFilter()});
document.addEventListener('click',e=>{
 if(!e.target.closest('.field')){ $('#symbolSuggestions').style.display='none';$('#tfSuggestions').style.display='none';}
});
setInterval(()=>{if(allTrades.length)applyFilters()},15000);
</script>
</body>
</html>
