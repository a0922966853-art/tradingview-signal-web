<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多資產即時進場助手</title>
<style>
:root{
  --bg:#0b1320;
  --panel:#142033;
  --panel2:#19283e;
  --line:#2d405d;
  --text:#eef5ff;
  --muted:#8ea5bf;
  --green:#2fe27b;
  --red:#ff526a;
  --yellow:#ffc400;
  --cyan:#23c7e8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
body{background:linear-gradient(180deg,#0b1320 0%,#09111b 100%)}
.wrap{max-width:1680px;margin:0 auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
h1{margin:0;font-size:24px}
.sub{margin-top:5px;color:var(--muted);font-size:13px}
.conn{padding:8px 12px;border:1px solid #24603d;border-radius:999px;background:#0e2518;color:var(--green);font-size:13px;font-weight:800}
.filters{display:grid;grid-template-columns:1.15fr .85fr .72fr .72fr 1fr 170px;gap:10px;padding:14px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.field{position:relative}
.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}
input,select,button{width:100%;min-height:42px;border:1px solid var(--line);border-radius:9px;background:#0e1928;color:var(--text);padding:9px 11px;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--cyan)}
button{cursor:pointer;font-weight:800}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-self:end}
.primary{background:#0d6e8d;border-color:#178bac}
.secondary{background:#18263a}
.suggestions{display:none;position:absolute;top:67px;left:0;right:0;z-index:50;max-height:220px;overflow:auto;background:#0e1928;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.suggestions div{padding:10px 11px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.suggestions div:hover{background:#1d2d45}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat{display:flex;align-items:center;gap:12px;min-height:86px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.stat-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#10223a;border:1px solid #24507c;font-size:22px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat strong{display:block;margin-top:3px;font-size:25px}
.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.cyan{color:var(--cyan)}
.card{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.toolbar-left{display:flex;align-items:center;gap:8px}
.toolbar-left select{width:85px;min-height:36px;padding:5px 8px}
.scope{color:var(--muted);font-size:13px}
.table-wrap{overflow:auto}
table{width:100%;min-width:1600px;border-collapse:collapse;white-space:nowrap}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center;font-size:13px}
th{position:sticky;top:0;z-index:2;background:#101a29;color:var(--cyan);font-weight:800}
th:first-child,td:first-child{position:sticky;left:0;z-index:3;text-align:left}
td:first-child{background:#142033;font-weight:800}
tr:hover td{filter:brightness(1.08)}
td.dir-buy{background:rgba(47,226,123,.12)!important;color:var(--green);font-weight:900}
td.dir-sell{background:rgba(255,82,106,.12)!important;color:var(--red);font-weight:900}
tr.row-open td{background:rgba(255,196,0,.055)}
tr.row-win td{background:rgba(47,226,123,.075)}
tr.row-loss td{background:rgba(255,82,106,.085)}
tr.row-be td{background:rgba(35,199,232,.07)}
tr.row-open td:first-child{background:#1b1a12}
tr.row-win td:first-child{background:#101d17}
tr.row-loss td:first-child{background:#211317}
tr.row-be td:first-child{background:#101d20}
td.result-open{background:rgba(255,196,0,.28)!important}
td.result-win{background:rgba(47,226,123,.28)!important}
td.result-loss{background:rgba(255,82,106,.30)!important}
td.result-be{background:rgba(35,199,232,.28)!important}
.badge{display:inline-block;min-width:72px;padding:5px 9px;border-radius:7px;font-weight:900}
.badge-open{background:rgba(255,196,0,.16);border:1px solid rgba(255,196,0,.5);color:var(--yellow)}
.badge-win{background:rgba(47,226,123,.16);border:1px solid rgba(47,226,123,.5);color:var(--green)}
.badge-loss{background:rgba(255,82,106,.16);border:1px solid rgba(255,82,106,.5);color:var(--red)}
.badge-be{background:rgba(35,199,232,.16);border:1px solid rgba(35,199,232,.5);color:var(--cyan)}
td.tp-hit{background:rgba(47,226,123,.22)!important;color:var(--green);font-weight:900}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;color:var(--muted);font-size:12px}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pages button{width:auto;min-width:36px;min-height:34px;padding:5px 9px}
.pages button.active{background:#245f95;border-color:#337ec1}
.empty{padding:40px!important;color:var(--muted)}
@media(max-width:1100px){
  .filters{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .buttons{grid-column:1/-1}
}
@media(max-width:600px){
  .wrap{padding:10px}
  .header{flex-direction:column}
  .filters,.stats{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>多資產即時進場助手</h1>
      <div class="sub">交易後台｜正式單歷史紀錄與即時狀態</div>
    </div>
    <div class="conn" id="conn">● 已連線</div>
  </div>

  <div class="filters">
    <div class="field">
      <label for="symbolSearch">商品搜尋</label>
      <input id="symbolSearch" autocomplete="off" placeholder="輸入 XAU、BTC、ETH…" oninput="showSymbolSuggestions()">
      <div class="suggestions" id="symbolSuggestions"></div>
    </div>

    <div class="field">
      <label for="tfSearch">時間週期</label>
      <input id="tfSearch" autocomplete="off" placeholder="輸入 5M、15M、1H…" oninput="showTfSuggestions()">
      <div class="suggestions" id="tfSuggestions"></div>
    </div>

    <div class="field">
      <label for="modeFilter">模式</label>
      <select id="modeFilter">
        <option value="">全部模式</option>
        <option value="1">① 回踩</option>
        <option value="2">② 續攻</option>
        <option value="3">③ 突破</option>
        <option value="4">④ 強趨勢</option>
        <option value="5">⑤ 急拉回落</option>
        <option value="6">⑥ SMC</option>
      </select>
    </div>

    <div class="field">
      <label for="resultFilter">結果</label>
      <select id="resultFilter">
        <option value="">全部結果</option>
        <option value="OPEN">進行中</option>
        <option value="WIN">獲利</option>
        <option value="LOSS">虧損</option>
        <option value="BE">保本</option>
      </select>
    </div>

    <div class="field">
      <label for="keyword">關鍵字搜尋</label>
      <input id="keyword" placeholder="單號 / 多空 / 模式…">
    </div>

    <div class="buttons">
      <button class="primary" onclick="applyFilters()">查詢</button>
      <button class="secondary" onclick="resetFilters()">清除</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-icon">📊</div><div><small>總交易</small><strong id="sTotal">0</strong></div></div>
    <div class="stat"><div class="stat-icon">✅</div><div><small>獲利</small><strong class="green" id="sWin">0</strong></div></div>
    <div class="stat"><div class="stat-icon">❌</div><div><small>虧損</small><strong class="red" id="sLoss">0</strong></div></div>
    <div class="stat"><div class="stat-icon">⏳</div><div><small>進行中</small><strong class="yellow" id="sOpen">0</strong></div></div>
    <div class="stat"><div class="stat-icon">%</div><div><small>勝率</small><strong class="cyan" id="sRate">0.0%</strong></div></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <span>顯示</span>
        <select id="pageSize" onchange="changePageSize()">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span>筆</span>
      </div>
      <div class="scope"><span id="activeScope">請先選擇商品與週期</span>｜單號由網站依時間自動排序</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>單號</th><th>訊號時間</th><th>商品</th><th>週期</th><th>方向</th><th>模式</th>
            <th>進場價</th><th>止損</th><th>止盈1</th><th>止盈2</th><th>止盈3</th><th>品質</th>
            <th>結果</th><th>出場價</th><th>最後更新</th><th>來源</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="16" class="empty">請先搜尋並選擇「商品」與「時間週期」</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer">
      <div id="countText">0 筆</div>
      <div class="pages" id="pages"></div>
    </div>
  </div>
</div>

<script>
const SYMBOLS=[
  'XAUUSD','XAGUSD','BTCUSDT','ETHUSDT','SOLUSDT','DOGEUSDT','PEPEUSDT',
  'NASDAQ','SPX500','US30','RUSSELL2000'
];
const TFS=['1','3','5','10','15','30','60','240'];
const TF_LABEL={'1':'1M','3':'3M','5':'5M','10':'10M','15':'15M','30':'30M','60':'1H','240':'4H'};

let allTrades=[];
let filtered=[];
let page=1;

const $=selector=>document.querySelector(selector);

function modeText(value){
  const modes={1:'① 回踩',2:'② 續攻',3:'③ 突破',4:'④ 強趨勢',5:'⑤ 急拉回落',6:'⑥ SMC'};
  return modes[value]||value||'-';
}
function numberText(value){
  return value===null||value===undefined||value===''?'-':Number(value).toFixed(2);
}
function timeText(value){
  return value?new Date(value).toLocaleString('zh-TW',{hour12:false}):'-';
}
function resultInfo(value){
  if(value==='WIN') return {row:'row-win',cell:'result-win',badge:'badge-win',text:'獲利'};
  if(value==='LOSS') return {row:'row-loss',cell:'result-loss',badge:'badge-loss',text:'虧損'};
  if(value==='BE') return {row:'row-be',cell:'result-be',badge:'badge-be',text:'保本'};
  return {row:'row-open',cell:'result-open',badge:'badge-open',text:'進行中'};
}
function chooseSymbol(value){
  $('#symbolSearch').value=value;
  $('#symbolSuggestions').style.display='none';
}
function chooseTf(value){
  $('#tfSearch').value=TF_LABEL[value]||value;
  $('#tfSearch').dataset.value=value;
  $('#tfSuggestions').style.display='none';
}
function showSymbolSuggestions(){
  const query=$('#symbolSearch').value.trim().toUpperCase();
  const box=$('#symbolSuggestions');
  const hits=SYMBOLS.filter(item=>item.includes(query)).slice(0,12);
  box.innerHTML=hits.map(item=>`<div onclick="chooseSymbol('${item}')">${item}</div>`).join('');
  box.style.display=hits.length?'block':'none';
}
function showTfSuggestions(){
  const query=$('#tfSearch').value.trim().toUpperCase();
  const box=$('#tfSuggestions');
  const hits=TFS.filter(value=>(TF_LABEL[value]||value).includes(query));
  box.innerHTML=hits.map(value=>`<div onclick="chooseTf('${value}')">${TF_LABEL[value]}</div>`).join('');
  box.style.display=hits.length?'block':'none';
}
function parseTf(){
  const raw=$('#tfSearch').value.trim().toUpperCase();
  const map={'1M':'1','3M':'3','5M':'5','10M':'10','15M':'15','30M':'30','1H':'60','4H':'240'};
  return $('#tfSearch').dataset.value||map[raw]||(TFS.includes(raw)?raw:'');
}
async function applyFilters(){
  const symbol=$('#symbolSearch').value.trim().toUpperCase();
  const timeframe=parseTf();

  if(!symbol||!timeframe){
    alert('請先選擇商品與時間週期');
    return;
  }

  $('#activeScope').textContent=`${symbol}｜${TF_LABEL[timeframe]||timeframe}`;
  $('#conn').textContent='● 讀取中';

  try{
    const response=await fetch('/api/trades?symbol='+encodeURIComponent(symbol),{cache:'no-store'});
    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||'讀取失敗');
    }

    allTrades=data.trades||[];
    runClientFilter();
    $('#conn').textContent='● 已連線';
  }catch(error){
    $('#conn').textContent='● 讀取失敗';
    alert(error.message);
  }
}
function runClientFilter(){
  const timeframe=parseTf();
  const mode=$('#modeFilter').value;
  const result=$('#resultFilter').value;
  const keyword=$('#keyword').value.trim().toLowerCase();

  filtered=allTrades.filter(trade=>{
    if(String(trade.timeframe)!==String(timeframe)) return false;
    if(mode&&String(trade.mode)!==mode) return false;
    if(result&&String(trade.result)!==result) return false;

    if(keyword){
      const searchText=[
        trade.external_trade_id,trade.id,trade.symbol,trade.direction,modeText(trade.mode),trade.result
      ].join(' ').toLowerCase();

      if(!searchText.includes(keyword)) return false;
    }
    return true;
  });

  page=1;
  renderStats();
  renderTable();
}
function renderStats(){
  const total=filtered.length;
  const win=filtered.filter(item=>item.result==='WIN').length;
  const loss=filtered.filter(item=>item.result==='LOSS').length;
  const open=filtered.filter(item=>item.result==='OPEN').length;
  const settled=win+loss;

  $('#sTotal').textContent=total;
  $('#sWin').textContent=win;
  $('#sLoss').textContent=loss;
  $('#sOpen').textContent=open;
  $('#sRate').textContent=(settled?win*100/settled:0).toFixed(1)+'%';
}
function buildSequenceMap(){
  const timeframe=parseTf();
  const scope=allTrades
    .filter(trade=>String(trade.timeframe)===String(timeframe))
    .slice()
    .sort((a,b)=>{
      const ta=new Date(a.signal_time||a.created_at||0).getTime();
      const tb=new Date(b.signal_time||b.created_at||0).getTime();
      if(ta!==tb) return ta-tb;
      return Number(a.id||0)-Number(b.id||0);
    });

  const map=new Map();
  scope.forEach((trade,index)=>map.set(String(trade.id),index+1));
  return map;
}
function renderTable(){
  const pageSize=Number($('#pageSize').value);
  const totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));

  if(page>totalPages) page=totalPages;

  const start=(page-1)*pageSize;
  const rows=filtered.slice(start,start+pageSize);
  const sequenceMap=buildSequenceMap();
  const body=$('#rows');

  body.innerHTML='';

  if(!rows.length){
    body.innerHTML='<tr><td colspan="16" class="empty">沒有符合條件的交易</td></tr>';
  }else{
    for(const trade of rows){
      const direction=String(trade.direction||'').toUpperCase();
      const result=resultInfo(trade.result);
      const displayId=sequenceMap.get(String(trade.id))||'-';

      body.innerHTML+=`<tr class="${result.row}">
        <td>#${displayId}</td>
        <td>${timeText(trade.signal_time)}</td>
        <td>${trade.symbol||'-'}</td>
        <td>${TF_LABEL[String(trade.timeframe)]||trade.timeframe||'-'}</td>
        <td class="${direction==='BUY'?'dir-buy':'dir-sell'}">${direction==='BUY'?'多單':'空單'}</td>
        <td>${modeText(trade.mode)}</td>
        <td>${numberText(trade.entry)}</td>
        <td>${numberText(trade.sl)}</td>
        <td class="${trade.hit_tp1?'tp-hit':''}">${numberText(trade.tp1)}${trade.hit_tp1?' ✓':''}</td>
        <td class="${trade.hit_tp2?'tp-hit':''}">${numberText(trade.tp2)}${trade.hit_tp2?' ✓':''}</td>
        <td class="${trade.hit_tp3?'tp-hit':''}">${numberText(trade.tp3)}${trade.hit_tp3?' ✓':''}</td>
        <td>${trade.quality==null?'-':Number(trade.quality).toFixed(0)+'%'}</td>
        <td class="${result.cell}"><span class="badge ${result.badge}">${result.text}</span></td>
        <td>${numberText(trade.exit_price)}</td>
        <td>${timeText(trade.status_updated_at||trade.created_at)}</td>
        <td>${trade.source||'-'}</td>
      </tr>`;
    }
  }

  $('#countText').textContent=`${filtered.length} 筆｜第 ${page}/${totalPages} 頁`;
  renderPages(totalPages);
}
function renderPages(totalPages){
  const box=$('#pages');
  box.innerHTML='';

  for(let number=1;number<=totalPages;number++){
    if(totalPages>9&&Math.abs(number-page)>2&&number!==1&&number!==totalPages) continue;

    const button=document.createElement('button');
    button.textContent=number;
    button.className=number===page?'active':'';
    button.onclick=()=>{
      page=number;
      renderTable();
    };
    box.appendChild(button);
  }
}
function changePageSize(){
  page=1;
  renderTable();
}
function resetFilters(){
  $('#symbolSearch').value='';
  $('#tfSearch').value='';
  delete $('#tfSearch').dataset.value;
  $('#modeFilter').value='';
  $('#resultFilter').value='';
  $('#keyword').value='';

  allTrades=[];
  filtered=[];
  page=1;

  $('#activeScope').textContent='請先選擇商品與週期';
  renderStats();
  $('#rows').innerHTML='<tr><td colspan="16" class="empty">請先搜尋並選擇「商品」與「時間週期」</td></tr>';
  $('#countText').textContent='0 筆';
  $('#pages').innerHTML='';
}
$('#modeFilter').addEventListener('change',()=>{if(allTrades.length)runClientFilter()});
$('#resultFilter').addEventListener('change',()=>{if(allTrades.length)runClientFilter()});
$('#keyword').addEventListener('input',()=>{if(allTrades.length)runClientFilter()});

document.addEventListener('click',event=>{
  if(!event.target.closest('.field')){
    $('#symbolSuggestions').style.display='none';
    $('#tfSuggestions').style.display='none';
  }
});

setInterval(()=>{
  if(allTrades.length) applyFilters();
},15000);
</script>
</body>
</html>
